
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MockInterview.ai - Master Your Next Interview</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script>
        // Theme initialization
        (function() {
            const theme = localStorage.getItem('theme') || 'light';
            if (theme === 'dark') {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
        })();

        // Critical Polyfill: Ensure process.env exists for the app runtime before modules load
        (function() {
            const existingProcess = window.process || {};
            const existingEnv = existingProcess.env || {};
            
            const env = {
                VITE_DEMO_MODE: 'true',
                VITE_API_URL: 'http://localhost:8080/api/v1',
                NODE_ENV: 'development',
                ...existingEnv
            };
            
            const processPolyfill = {
                version: 'v16.0.0',
                nextTick: function(cb) { setTimeout(cb, 0); },
                ...existingProcess,
                env: env
            };

            window.process = processPolyfill;
            globalThis.process = processPolyfill;
        })();

        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: "#194ce6",
                        "primary-hover": "#143db8",
                        "background-light": "#f6f6f8",
                        "background-dark": "#0f111a",
                        "surface-dark": "#1c1e26",
                        "surface-light": "#ffffff",
                        "border-dark": "rgba(255,255,255,0.1)",
                        "border-light": "rgba(0,0,0,0.05)",
                        "text-secondary": "#9da4b8",
                    },
                    fontFamily: {
                        display: ["Inter", "sans-serif"],
                        mono: ["JetBrains Mono", "monospace"],
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #3c4253; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #4b5563; }
        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .dark .glass-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .light .glass-card, html:not(.dark) .glass-card {
            background: rgba(255, 255, 255, 0.7);
            border: 1px solid rgba(0, 0, 0, 0.05);
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
        }
        @keyframes blink { 50% { opacity: 0; } }
        .animate-blink { animation: blink 1s step-end infinite; }
    </style>
<script type="importmap">

    "zustand/": "https://esm.sh/zustand@^5.0.11/",
    "vite": "https://esm.sh/vite@^7.3.1",
    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.4"
  }
}
</script>
</head>
